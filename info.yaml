project:
  title: "Water ATM Controller"
  author: "Raghu Daivala"
  description: "FSM-based Water ATM that dispenses water based on inserted coin and flow sensor pulses."
  language: "Verilog"
  clock_hz: 100000

  source_files:
    - project.v

pinout:
  ui[0]: "Coin Rs1"
  ui[1]: "Coin Rs2"
  ui[2]: "Coin Rs5"
  ui[3]: "Coin Rs10"
  ui[4]: "Flow Sensor"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  uo[0]: "Valve ON/OFF"
  uo[1]: "Liters bit0"
  uo[2]: "Liters bit1"
  uo[3]: "Liters bit2"
  uo[4]: "Liters bit3"
  uo[5]: "Liters bit4"
  uo[6]: "Liters bit5"
  uo[7]: "Liters bit6"

  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"
